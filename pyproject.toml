# pyproject.toml
# ─────────────────────────────────────────────
# Python equivalent of package.json
# Install everything with: pip install -e .
# ─────────────────────────────────────────────

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "kaggle-ai-agents"
version     = "0.1.0"
description = "Kaggle AI Agents course — day-by-day exercises"
requires-python = ">=3.11"

dependencies = [
    "google-adk>=2.2.0",
    "google-genai>=2.8.0",
    "litellm>=1.83.0",
    "python-dotenv>=1.2.0",
    "anthropic>=0.109.0",
    "openai>=2.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
